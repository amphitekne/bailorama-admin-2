name: build-and-push

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  build-production:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute metadata
        run: |
          echo "DATE_TAG=$(date -u +'%d%m%Y')" >> $GITHUB_ENV
          echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_BAILORAMA_API_URL=${{ vars.BAILORAMA_API_URL }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:production-${{ env.IMAGE_TAG }}
            ghcr.io/${{ github.repository }}:production-${{ env.DATE_TAG }}.${{ github.run_number }}

  build-development:
    runs-on: ubuntu-latest
    environment: development

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute metadata
        run: |
          echo "DATE_TAG=$(date -u +'%d%m%Y')" >> $GITHUB_ENV
          echo "DEPLOYED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV
          echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_BAILORAMA_API_URL=${{ vars.BAILORAMA_API_URL }}
          tags: |
            ghcr.io/${{ github.repository }}:dev
            ghcr.io/${{ github.repository }}:development-${{ env.IMAGE_TAG }}
            ghcr.io/${{ github.repository }}:development-${{ env.DATE_TAG }}.${{ github.run_number }}

      - name: Trigger infra dev deploy
        env:
          INFRA_TOKEN: ${{ secrets.GH_PAT_DEV }}
          INFRA_OWNER: amphitekne
          INFRA_REPO: bailorama-infra
          DEV_IMAGE_TAG: development-${{ env.IMAGE_TAG }}
        run: |
          set -euo pipefail

          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${INFRA_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${INFRA_OWNER}/${INFRA_REPO}/actions/workflows/deploy-dev.yml/dispatches" \
            -d @- <<EOF
          {
            "ref": "main",
            "inputs": {
              "service": "frontend-admin",
              "image_tag": "${DEV_IMAGE_TAG}",
              "deployed_at": "${DEPLOYED_AT}"
            }
          }
          EOF
