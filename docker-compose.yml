services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_BAILORAMA_API_URL=${VITE_BAILORAMA_API_URL}
    container_name: bailorama-admin-v2-prod
    ports:
      - "3001:80"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:80 || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
